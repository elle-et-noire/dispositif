name: Deploy to GitHub Pages

# 文書だけの変更では実行しない。記事（post/*.md）はサイトの内容なので除外しない。
# 除外したファイル以外が1つでも変わっていれば実行する。
on:
  # main へのプッシュで検査し、成功したらデプロイする。
  push:
    branches: [ main ]
    paths-ignore: &docs-only
      - README.md
      - ROADMAP.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
  # プルリクエストでは検査だけを行い、デプロイしない。
  pull_request:
    paths-ignore: *docs-only
  # GitHub上のActionsタブからこのワークフローを手動で実行できます。
  workflow_dispatch:

# 同じブランチの古い実行は取り消す。main のデプロイは途中で止めず、順に実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# このジョブがリポジトリをクローンし、ページデプロイメントを作成することを許可します。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 型検査と単体テスト。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # astro check は数式フォントの準備を必要としないが、build と同じ状態にそろえる。
      - run: npm run copy:math-fonts
      - run: npx astro check
      - run: npm test

  # 本番ビルドを astro preview で配信し、Chromium と Firefox でブラウザテストを実行する。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 本文の組版をローカルの検証環境（Noto Sans CJK JP）とそろえる。
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright-core install --with-deps chromium firefox
      - run: npm run build
      - name: Run browser tests against astro preview
        run: |
          npx astro preview --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/dispositif/ && break; sleep 1; done
          npm run test:browser
      - if: failure()
        run: cat preview.log

  build:
    needs: [check, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
